<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanz Clean | by Yanz Storu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi RGB Glow Progress Bar */
        @keyframes rgbGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .rgb-bar {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 200% 200%;
            animation: rgbGlow 1.5s linear infinite;
            transition: width 0.2s ease;
        }
        
        /* Animasi Sidebar & Rating Ticker */
        .slide-in { transform: translateX(0); }
        .slide-out { transform: translateX(-100%); }
        
        .ticker-enter {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .ticker-exit {
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: all 0.4s ease;
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen flex flex-col relative overflow-hidden selection:bg-blue-500 selection:text-white">

    <!-- Config Backend URL (Otomatis ke Panel Kamu) -->
    <script>
        const BACKEND_URL = 'http://alfa-store-officials.alfamarket2.my.id:4367';
    </script>

    <!-- Modal Popup Donasi Saweria -->
    <div id="donationPopup" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 p-6 md:p-8 rounded-2xl shadow-[0_0_30px_rgba(234,179,8,0.2)] text-center max-w-sm w-full border border-gray-800 animate-bounce-short">
            <div class="w-16 h-16 bg-yellow-500/10 text-yellow-500 rounded-full flex items-center justify-center mx-auto mb-4 border border-yellow-500/30">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-yellow-400">Support Developer</h2>
            <p class="mb-6 text-gray-400 text-sm leading-relaxed">Bantu support developer <span class="text-white font-semibold">Yanz Storu</span> dengan cara donasi agar server dan project ini terus aktif!</p>
            <div class="flex items-center justify-center gap-3">
                <button onclick="closePopup()" class="w-1/2 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl font-medium transition border border-gray-700">Close</button>
                <a href="https://saweria.co/yanzstoru" target="_blank" class="w-1/2 py-2.5 bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-black rounded-xl font-bold transition shadow-lg shadow-yellow-500/20 flex items-center justify-center gap-1">
                    <span>Donasi</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            </div>
        </div>
    </div>

    <!-- Header & Navigasi -->
    <header class="p-4 flex justify-between items-center bg-gray-900/50 backdrop-blur-md border-b border-gray-800/80 sticky top-0 z-40">
        <button onclick="toggleSidebar()" class="p-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl transition border border-gray-700 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <div class="text-center">
            <h1 class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500">YANZ CLEAN</h1>
            <p class="text-[10px] text-gray-500 tracking-widest font-mono">DEV BY YANZ STORU</p>
        </div>
        <div class="w-10"></div>
    </header>

    <!-- Sidebar Input Rating & Komentar -->
    <div id="sidebar" class="fixed top-0 left-0 h-full w-80 bg-gray-900/95 backdrop-blur-xl shadow-2xl z-50 transform slide-out transition-transform duration-300 p-6 border-r border-gray-800 flex flex-col">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-lg font-bold text-blue-400">Beri Rating & Review</h2>
            <button onclick="toggleSidebar()" class="p-2 text-gray-400 hover:text-white rounded-lg bg-gray-800 border border-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="space-y-4 flex-grow">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Nama Anda</label>
                <input type="text" id="raterName" placeholder="Contoh: Alex" class="w-full p-3 bg-gray-800/80 rounded-xl border border-gray-700 focus:outline-none focus:border-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Bintang</label>
                <select id="raterStars" class="w-full p-3 bg-gray-800/80 rounded-xl border border-gray-700 focus:outline-none focus:border-blue-500 text-sm">
                    <option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ (5/5)</option>
                    <option value="⭐⭐⭐⭐">⭐⭐⭐⭐ (4/5)</option>
                    <option value="⭐⭐⭐">⭐⭐⭐ (3/5)</option>
                    <option value="⭐⭐">⭐⭐ (2/5)</option>
                    <option value="⭐">⭐ (1/5)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-1">Komentar</label>
                <textarea id="raterComment" placeholder="Tuliskan pengalaman kamu..." class="w-full p-3 bg-gray-800/80 rounded-xl border border-gray-700 h-28 focus:outline-none focus:border-blue-500 text-sm resize-none"></textarea>
            </div>
        </div>

        <button onclick="submitReview()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-xl font-bold transition shadow-lg shadow-blue-500/20 text-sm">Kirim Komentar Global</button>
    </div>

    <!-- Area Utama Upload -->
    <main class="flex-grow flex items-center justify-center p-4 relative z-10">
        <div class="bg-gray-900/90 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full border border-gray-800">
            <h2 class="text-xl font-bold text-center mb-6 text-gray-100">Upload Video HD</h2>
            
            <!-- Box Dropzone -->
            <div class="border-2 border-dashed border-gray-700 hover:border-blue-500/50 rounded-2xl p-8 text-center mb-5 transition cursor-pointer bg-gray-950/40 group" onclick="document.getElementById('videoInput').click()">
                <div class="w-12 h-12 bg-blue-500/10 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </div>
                <p class="text-sm font-medium text-gray-300" id="fileName">Klik / Tarik file video ke sini</p>
                <p class="text-xs text-gray-500 mt-1">Format MP4, MOV, atau AVI</p>
                <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="updateFileName(this)">
            </div>

            <!-- Input Nomor WhatsApp -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-gray-400 mb-1.5">Nomor WhatsApp Penerima</label>
                <input type="text" id="waNumber" placeholder="628xxxxxxxxxx" class="w-full p-3 bg-gray-950/60 rounded-xl border border-gray-700/80 focus:outline-none focus:border-blue-500 text-sm text-gray-200">
            </div>

            <!-- Tombol Upload -->
            <button onclick="startUpload()" class="w-full py-3.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:opacity-95 rounded-xl font-bold text-sm tracking-wide transition shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2">
                <span>UPLOAD NOW</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>

            <!-- RGB Progress Bar -->
            <div id="progressContainer" class="mt-6 hidden">
                <div class="flex justify-between text-xs mb-2 font-mono text-gray-400">
                    <span id="statusText">Mengunggah...</span>
                    <span id="progressText" class="text-blue-400 font-bold">0%</span>
                </div>
                <div class="w-full h-3 bg-gray-950 rounded-full overflow-hidden border border-gray-800 p-0.5">
                    <div id="progressBar" class="h-full w-0 rgb-bar rounded-full"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Rating Ticker (Pojok Kanan Bawah) -->
    <div class="fixed bottom-5 right-5 z-30">
        <div id="reviewTicker" class="bg-gray-900/90 backdrop-blur-md p-4 rounded-2xl shadow-2xl border border-gray-800 max-w-xs w-72 ticker-exit">
            <div class="flex items-center justify-between mb-1.5">
                <span id="tickerName" class="font-bold text-xs text-blue-400 truncate">Loading...</span>
                <span id="tickerStars" class="text-[10px]"></span>
            </div>
            <p id="tickerComment" class="text-xs text-gray-300 italic line-clamp-2 leading-relaxed"></p>
        </div>
    </div>

    <!-- Script Logika Frontend -->
    <script>
        function closePopup() { document.getElementById('donationPopup').style.display = 'none'; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('slide-out'); }
        
        function updateFileName(input) {
            document.getElementById('fileName').innerText = input.files[0] ? input.files[0].name : "Klik / Tarik file video ke sini";
        }

        // Logic Upload Video ke Backend Server
        function startUpload() {
            const file = document.getElementById('videoInput').files[0];
            const wa = document.getElementById('waNumber').value;
            
            if (!file || !wa) return alert("Pilih file video dan masukkan nomor WhatsApp!");

            document.getElementById('progressContainer').classList.remove('hidden');
            const bar = document.getElementById('progressBar');
            const text = document.getElementById('progressText');
            const status = document.getElementById('statusText');

            const formData = new FormData();
            formData.append('video', file);
            formData.append('waNumber', wa);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `${BACKEND_URL}/api/upload`, true);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    bar.style.width = percent + '%';
                    text.innerText = percent + '%';
                    if(percent === 100) status.innerText = "Mengirim ke WhatsApp...";
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    alert("✅ Sukses! Video sedang dikirim oleh bot ke nomor WhatsApp kamu.");
                    bar.style.width = '0%';
                    document.getElementById('progressContainer').classList.add('hidden');
                } else {
                    alert("❌ Gagal: " + xhr.responseText);
                    document.getElementById('progressContainer').classList.add('hidden');
                }
            };

            xhr.onerror = function() {
                alert("❌ Tidak dapat terhubung ke server Bot. Pastikan server Pterodactyl dalam keadaan ON!");
                document.getElementById('progressContainer').classList.add('hidden');
            };

            xhr.send(formData);
        }

        // Logic Rating Global & Animasi Keluar Masuk
        let globalReviews = [
            { name: "Yanz Storu", stars: "⭐⭐⭐⭐⭐", comment: "Sistem Yanz Clean siap digunakan global!" }
        ];

        async function fetchReviews() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/reviews`);
                if(res.ok) globalReviews = await res.json();
            } catch (e) { console.log("Gagal memuat review global."); }
        }

        async function submitReview() {
            const name = document.getElementById('raterName').value;
            const comment = document.getElementById('raterComment').value;
            const stars = document.getElementById('raterStars').value;

            if(!name || !comment) return alert("Nama dan komentar wajib diisi!");

            try {
                const res = await fetch(`${BACKEND_URL}/api/reviews`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, stars, comment })
                });
                if(res.ok) {
                    alert("Review berhasil dikirim!");
                    toggleSidebar();
                    document.getElementById('raterName').value = '';
                    document.getElementById('raterComment').value = '';
                    fetchReviews();
                }
            } catch(e) {
                alert("Gagal mengirim review ke server.");
            }
        }

        // Ticker Animasi Keluar-Masuk Berulang
        let reviewIndex = 0;
        function cycleReviews() {
            if(globalReviews.length === 0) return;
            const ticker = document.getElementById('reviewTicker');
            
            // Animasi Keluar
            ticker.classList.remove('ticker-enter');
            ticker.classList.add('ticker-exit');
            
            setTimeout(() => {
                document.getElementById('tickerName').innerText = globalReviews[reviewIndex].name;
                document.getElementById('tickerStars').innerText = globalReviews[reviewIndex].stars;
                document.getElementById('tickerComment').innerText = `"${globalReviews[reviewIndex].comment}"`;
                
                // Animasi Masuk
                ticker.classList.remove('ticker-exit');
                ticker.classList.add('ticker-enter');
                
                reviewIndex = (reviewIndex + 1) % globalReviews.length;
            }, 400);
        }

        fetchReviews().then(() => {
            cycleReviews();
            setInterval(cycleReviews, 4500); // Ganti review setiap 4.5 detik
        });
    </script>
</body>
</html>
