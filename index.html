<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanz Clean | System Maintenance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Background Mesh Grid Pattern */
        .bg-grid {
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Animated Glowing Sphere */
        @keyframes orbFloat {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.1); }
        }
        .animate-orb {
            animation: orbFloat 8s ease-in-out infinite;
        }

        /* Subtle Shimmer for Border */
        @keyframes borderGlow {
            0%, 100% { border-color: rgba(59, 130, 246, 0.3); }
            50% { border-color: rgba(168, 85, 247, 0.6); }
        }
        .glow-border {
            animation: borderGlow 4s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-grid selection:bg-cyan-500 selection:text-black">

    <!-- Ambient Glowing Orbs -->
    <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-cyan-500/20 rounded-full blur-[120px] pointer-events-none animate-orb"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[140px] pointer-events-none animate-orb" style="animation-delay: -4s;"></div>

    <!-- Main Card Container -->
    <main class="w-full max-w-lg relative z-10">
        <div class="bg-gray-900/60 backdrop-blur-2xl p-8 md:p-10 rounded-3xl border glow-border shadow-[0_0_50px_rgba(0,0,0,0.8)] text-center relative overflow-hidden">
            
            <!-- Top Cyber Lines Accent -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-2/3 h-[2px] bg-gradient-to-r from-transparent via-cyan-500 to-transparent"></div>

            <!-- Status Pill Badge -->
            <div class="inline-flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-cyan-950/60 border border-cyan-500/30 text-cyan-400 text-xs font-mono mb-8 shadow-inner">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                </span>
                <span>SYSTEM UPGRADE IN PROGRESS</span>
            </div>

            <!-- Animated Tech Graphic Icon -->
            <div class="relative w-24 h-24 mx-auto mb-8 flex items-center justify-center">
                <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500 to-purple-500 rounded-3xl rotate-6 blur-lg opacity-30"></div>
                <div class="relative w-full h-full bg-gray-950/90 rounded-3xl border border-slate-800 flex items-center justify-center text-cyan-400 shadow-2xl">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.87-5.87M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l5.654-4.654m0 0l3.03-2.496c.14-.468.382-.89.766-1.208L18 3.5m-6.22 8.78L3.5 18M18 3.5l1.62 1.62A2.652 2.652 0 0118 8.25l-1.88-1.88M18 3.5L14.25 7.25"></path>
                    </svg>
                </div>
            </div>

            <!-- Typography Header -->
            <h1 class="text-3xl md:text-4xl font-black tracking-tight text-white mb-3">
                YANZ <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500">CLEAN</span>
            </h1>
            <p class="text-slate-400 text-sm leading-relaxed mb-8 max-w-sm mx-auto font-light">
                Server sedang dalam pemeliharaan berkala untuk meningkatkan kecepatan dan kualitas optimasi video.
            </p>

            <!-- Server Metrics / Progress Box -->
            <div class="bg-gray-950/70 border border-slate-800/80 rounded-2xl p-4 mb-8 text-left font-mono text-xs space-y-3">
                <div class="flex justify-between items-center text-slate-400">
                    <span class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                        Database Sync
                    </span>
                    <span class="text-emerald-400">99.8%</span>
                </div>
                <div class="w-full h-1.5 bg-slate-900 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 w-[95%] rounded-full animate-pulse"></div>
                </div>
                <div class="flex justify-between text-[11px] text-slate-500 pt-1">
                    <span>Est. Selesai: <strong class="text-slate-300 font-normal">Segera</strong></span>
                    <span>Host: <strong class="text-slate-300 font-normal">Pterodactyl Node</strong></span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="location.reload()" class="w-full sm:w-1/2 py-3.5 px-4 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-xl font-medium text-xs transition border border-slate-800 flex items-center justify-center gap-2 active:scale-95">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Refresh Halaman</span>
                </button>
                <a href="https://wa.me/6285709160769" target="_blank" class="w-full sm:w-1/2 py-3.5 px-4 bg-gradient-to-r from-cyan-500 via-blue-600 to-purple-600 hover:opacity-90 text-white rounded-xl font-bold text-xs tracking-wider transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 active:scale-95">
                    <span>HUBUNGI ADMIN</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            </div>

            <!-- Footer Info -->
            <div class="mt-8 pt-6 border-t border-slate-800/50 text-[10px] text-slate-500 font-mono flex justify-between items-center">
                <span>&copy; 2026 Yanz Clean</span>
                <span class="text-slate-400">Dev by Yanz Storu</span>
            </div>
        </div>
    </main>

</body>
</html>
