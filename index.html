<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YanzClean | Developer Yanz Storu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -2;
        }

        .bg-glow {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        .card-main {
            background: #0a0a0a;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8),
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .upload-area {
            border: 2px dashed rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.02);
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .input-custom {
            background: #000000;
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            transition: all 0.3s ease;
        }
        .input-custom:focus {
            border-color: #34d399;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
            outline: none;
        }
        .input-custom::placeholder {
            color: rgba(16, 185, 129, 0.3);
        }

        /* Garis RGB Loading */
        .rgb-loading-wrapper {
            display: none;
            width: 100%;
            background: rgba(255,255,255,0.05);
            border-radius: 50px;
            overflow: hidden;
            margin-top: 15px;
        }
        .rgb-bar {
            height: 6px;
            width: 0%;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 200% auto;
            animation: rgb-glow 2s linear infinite;
            border-radius: 50px;
            transition: width 0.3s ease;
        }
        @keyframes rgb-glow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .swal2-popup { border: 1px solid rgba(16, 185, 129, 0.3) !important; border-radius: 20px !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <script>
        // URL Backend Pterodactyl Bot Anda
        const BACKEND_URL = 'https://alfa-store-officials.alfamarket2.my.id:4367';
    </script>

    <div class="bg-glow"></div>

    <!-- Popup Donasi di Awal Masuk -->
    <div id="donationPopup" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="card-main p-6 md:p-8 text-center max-w-sm w-full">
            <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/30">
                <i class="fa-solid fa-hand-holding-dollar text-2xl"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-emerald-400">Support Developer</h2>
            <p class="mb-6 text-gray-400 text-sm leading-relaxed">Bantu support developer <span class="text-white font-semibold">Yanz Storu</span> dengan cara donasi agar server dan project ini terus aktif!</p>
            <div class="flex items-center justify-center gap-3">
                <button onclick="closePopup()" class="w-1/2 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-gray-300 rounded-xl font-medium transition border border-zinc-800">Tutup</button>
                <a href="https://saweria.co/yanzstoru" target="_blank" class="w-1/2 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-black rounded-xl font-bold transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-1">
                    <span>Donasi</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div data-aos="fade-down" data-aos-duration="1000" class="text-center mb-8 mt-6 z-10">
        <h1 class="text-5xl md:text-6xl font-bold tracking-tight text-white mb-2">
            Yanz<span class="text-emerald-500">Clean</span>
        </h1>
        <p class="text-emerald-400/70 tracking-widest text-xs md:text-sm uppercase font-semibold">Developer Yanz Storu</p>
    </div>

    <!-- Container Utama -->
    <main data-aos="zoom-in" data-aos-duration="1200" class="w-full max-w-lg z-10">
        <div class="card-main p-8 flex flex-col gap-6">
            
            <form id="uploadForm" class="flex flex-col gap-5">
                
                <!-- Area Upload Video -->
                <div class="relative flex flex-col">
                    <label class="text-sm font-semibold text-emerald-400 mb-2"><i class="fa-solid fa-film"></i> Upload Video (Maks 500MB)</label>
                    <div id="drop-zone" class="upload-area rounded-xl p-8 text-center cursor-pointer relative overflow-hidden group" onclick="document.getElementById('videoFile').click()">
                        <input type="file" id="videoFile" accept="video/*" class="hidden" onchange="updateFileName(this)" required>
                        <i class="fa-solid fa-cloud-arrow-up text-4xl text-emerald-600/50 group-hover:text-emerald-400 transition-colors duration-300 mb-2"></i>
                        <p id="fileName" class="text-sm text-emerald-600/70 group-hover:text-emerald-400 transition-colors">Klik atau seret video ke sini</p>
                    </div>
                </div>

                <!-- Input Nomor WA -->
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-emerald-400 mb-2"><i class="fa-brands fa-whatsapp"></i> Nomor WhatsApp</label>
                    <input type="number" id="waNumber" placeholder="Contoh: 62857..." class="input-custom w-full rounded-xl p-4 font-mono text-lg" required>
                </div>

                <!-- RGB Loading Bar -->
                <div id="loadingUI" class="hidden mt-2">
                    <p id="loadingText" class="text-xs text-center text-emerald-400 mb-1 font-semibold animate-pulse">Memproses Video ke Resolusi HD...</p>
                    <div class="rgb-loading-wrapper" style="display: block;">
                        <div class="rgb-bar" id="loadingBar"></div>
                    </div>
                </div>

                <!-- Tombol Upload -->
                <button type="submit" id="btnUpload" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-4 px-6 rounded-xl transform transition hover:scale-[1.02] active:scale-95 uppercase tracking-wider mt-2 shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                    <i class="fa-solid fa-rocket mr-2"></i> Upload Sekarang
                </button>
            </form>

            <div class="h-px w-full bg-emerald-900/50 my-2"></div>

            <!-- Tombol Navigasi Bawah -->
            <div class="grid grid-cols-1 gap-3">
                <a href="https://chat.whatsapp.com/EEiNqsNkOmgEKB5IEpY6Sy?s=cl&p=a&mlu=0&ilr=4" target="_blank" class="flex items-center justify-center gap-2 w-full bg-black border border-emerald-800 hover:border-emerald-400 hover:bg-emerald-900/20 text-emerald-400 font-semibold py-3 px-4 rounded-xl transition duration-300">
                    <i class="fa-solid fa-users"></i> Join Komunitas
                </a>
                
                <button onclick="showTutorial()" class="flex items-center justify-center gap-2 w-full bg-black border border-emerald-800 hover:border-emerald-400 hover:bg-emerald-900/20 text-emerald-400 font-semibold py-3 px-4 rounded-xl transition duration-300">
                    <i class="fa-solid fa-book-open"></i> Cara Penggunaan
                </button>
                
                <a href="https://wa.me/6285783587546" target="_blank" class="flex items-center justify-center gap-2 w-full bg-black border border-red-900/50 hover:border-red-500 hover:bg-red-900/20 text-red-500 font-semibold py-3 px-4 rounded-xl transition duration-300">
                    <i class="fa-solid fa-bug"></i> Lapor Masalah Server
                </a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();

        function closePopup() { 
            document.getElementById('donationPopup').style.display = 'none'; 
        }

        function updateFileName(input) {
            document.getElementById('fileName').innerText = input.files[0] ? input.files[0].name : "Klik atau seret video ke sini";
        }

        function showTutorial() {
            Swal.fire({
                title: '<span style="color:#10b981">Cara Pakai Bot</span>',
                html: `
                    <div style="text-align: left; font-size: 14px; color: #a1a1aa; line-height: 1.6;">
                        <p>1. Masukkan file video yang ingin dijernihkan (Maks 500MB).</p>
                        <p>2. Pastikan kamu sudah join di grup WhatsApp.</p>
                        <p>3. Masukkan nomor WA kamu (Awali 62).</p>
                        <p>4. Klik Upload dan tunggu garis RGB selesai.</p>
                        <p>5. Bot otomatis mengirim video HD ke dalam grup dan men-tag nomormu.</p>
                    </div>
                `,
                background: '#0a0a0a',
                confirmButtonText: 'Paham!',
                buttonsStyling: false,
                customClass: { confirmButton: 'bg-emerald-600 text-black font-bold px-6 py-2 rounded-xl mt-4 hover:bg-emerald-500 transition' }
            });
        }

        // Proses Form Upload ke Backend Pterodactyl
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = document.getElementById('videoFile').files[0];
            const number = document.getElementById('waNumber').value;
            const btnUpload = document.getElementById('btnUpload');
            const loadingUI = document.getElementById('loadingUI');
            const loadingBar = document.getElementById('loadingBar');
            const loadingText = document.getElementById('loadingText');

            if(!file || !number) return;

            // Batasan 500MB
            const maxSizeInBytes = 500 * 1024 * 1024;
            if (file.size > maxSizeInBytes) {
                Swal.fire({
                    title: 'Ukuran Video Terlalu Besar! 😱',
                    html: `<p style="color:#a1a1aa;">Batas maksimal ukuran video adalah <b>500 MB</b>.<br>Video kamu ukurannya <b>${(file.size / (1024 * 1024)).toFixed(2)} MB</b>.</p>`,
                    icon: 'warning',
                    background: '#0a0a0a', color: '#fff',
                    confirmButtonText: 'Oke, Ganti Video',
                    buttonsStyling: false,
                    customClass: { confirmButton: 'bg-emerald-600 text-black font-bold px-6 py-2 rounded-xl hover:bg-emerald-500' }
                });
                return;
            }

            btnUpload.disabled = true;
            btnUpload.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
            btnUpload.classList.add('opacity-50', 'cursor-not-allowed');
            loadingUI.style.display = 'block';
            
            let width = 0;
            let loadingInterval = setInterval(() => {
                if(width >= 90) clearInterval(loadingInterval);
                else { width += Math.random() * 3; if(width > 90) width = 90; loadingBar.style.width = width + '%'; }
            }, 800);

            const formData = new FormData();
            formData.append('video', file);
            formData.append('number', number);

            try {
                const response = await fetch(`${BACKEND_URL}/upload`, { 
                    method: 'POST', 
                    body: formData 
                });
                
                const result = await response.json();
                clearInterval(loadingInterval);
                loadingBar.style.width = '100%';

                if (response.status === 403 && result.status === 'not_in_group') {
                    loadingBar.style.background = '#f59e0b';
                    loadingText.innerHTML = '<span class="text-amber-500">Gagal: Kamu belum join grup!</span>';

                    setTimeout(() => {
                        Swal.fire({
                            title: 'Kamu Belum Join Grup 🙈',
                            html: '<p style="color:#a1a1aa;">Nomor WA kamu belum terdaftar di grup.<br>Yuk, gabung dulu buat nikmatin fiturnya!</p>',
                            icon: 'warning',
                            background: '#0a0a0a', color: '#fff',
                            showCancelButton: true,
                            confirmButtonText: 'Cek Grup',
                            cancelButtonText: 'Tutup',
                            buttonsStyling: false,
                            customClass: { 
                                confirmButton: 'bg-amber-500 text-black font-bold px-5 py-2.5 rounded-xl mx-2 hover:bg-amber-400 transition',
                                cancelButton: 'bg-zinc-800 text-white px-5 py-2.5 rounded-xl mx-2 hover:bg-zinc-700 transition'
                            }
                        }).then((res) => {
                            if (res.isConfirmed) window.open('https://chat.whatsapp.com/EEiNqsNkOmgEKB5IEpY6Sy?s=cl&p=a&mlu=0&ilr=4', '_blank');
                            resetUI();
                        });
                    }, 500);
                    return; 
                }

                if (response.ok && result.status === 'success') {
                    loadingText.innerText = "Sukses! Mengirim ke grup...";
                    setTimeout(() => {
                        Swal.fire({
                            title: 'Berhasil! 🎉',
                            html: '<p style="color:#a1a1aa;">Video sedang dikirim ke grup dan nomor kamu sudah di-tag!</p>',
                            icon: 'success',
                            background: '#0a0a0a', color: '#fff',
                            confirmButtonText: 'Oke',
                            buttonsStyling: false,
                            customClass: { confirmButton: 'bg-emerald-600 text-black font-bold px-6 py-2 rounded-xl hover:bg-emerald-500' }
                        });
                        resetUI();
                    }, 1000);
                } else {
                    throw new Error(result.message || 'Error server');
                }
            } catch (error) {
                clearInterval(loadingInterval);
                loadingBar.style.width = '100%';
                loadingBar.style.background = '#ef4444';
                loadingText.innerHTML = '<span class="text-red-500">Gagal terhubung ke bot.</span>';

                setTimeout(() => {
                    Swal.fire({
                        title: 'Upload Gagal 💔',
                        html: '<p style="color:#a1a1aa;">Video ditolak oleh server. Pastikan bot sedang online atau ukuran video tidak melebihi 500MB.</p>',
                        icon: 'error',
                        background: '#0a0a0a', color: '#fff',
                        confirmButtonText: 'Oke',
                        buttonsStyling: false,
                        customClass: { confirmButton: 'bg-red-600 text-white px-6 py-2 rounded-xl hover:bg-red-500' }
                    });
                    resetUI();
                }, 500);
            }

            function resetUI() {
                setTimeout(() => {
                    btnUpload.disabled = false;
                    btnUpload.innerHTML = '<i class="fa-solid fa-rocket mr-2"></i> Upload Sekarang';
                    btnUpload.classList.remove('opacity-50', 'cursor-not-allowed');
                    loadingUI.style.display = 'none';
                    loadingBar.style.width = '0%';
                    loadingBar.style.background = 'linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000)';
                    document.getElementById('fileName').innerText = "Klik atau seret video ke sini";
                    document.getElementById('uploadForm').reset();
                }, 2000);
            }
        });
    </script>
</body>
</html>
